<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>

        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color:lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;
            flex-shrink: 1;
            flex-grow: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item" style="flex-grow: 1;">B</div>
        <div class="item"  style="flex-grow: 2;">C</div>
    </div>
</body>
</html>
