<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
            background-color: rgb(242, 239, 239);
            margin: auto;
            font-family: Arial, Helvetica, sans-serif;
        }
         th, td, caption {
            padding: 6px 30px;
            border: 1px solid black;
            text-align: center;
         }
        caption {
            border-bottom: none;
            font-weight: 700;
            background-color: rgb(174, 208, 196);
        }
        h1 {
            text-align: center;
        }
        col.cnome {
            background-color: rgb(89, 215, 173);
        }
        col.cgrupo {
            background-color: rgb(227, 224, 219);
        }        
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class = "cnome"> 
            <col class = "cgrupo" span="3"> 
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalisa</td>
        </tr>
        <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>19</td>
            <td>Vendedor</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>M</td>
            <td>39</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Otávio</td>
            <td>M</td>
            <td>22</td>
            <td>Nutricionista</td>
        </tr>
    </table>
</body>
</html>
