<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css" />
    <link rel="stylesheet" href="estilos/media-query.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
    <main>
        <section id="login">
            <div id="imagem"></div>
            <div id="formulario">
                <h1>Login</h1>
                <p id="msg">
                    Seja bem-vindo(a) novamente. Faça login para acessar a sua conta e
                    fazer as configurações no seu ambiente.
                </p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <i class="fa-solid fa-circle-user"></i>
                        <input type="email" name="login" id="ilogin" placeholder=" seu e-mail" autocomplete="email"
                            required maxlength="100"/>
                        <label for="ilogin"></i></label>
                    </div>
                        <div class="senha">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" name="senha" id="isenha" placeholder=" sua senha"
                                autocomplete="current-password" required minlength="8" maxlength="30" />
                            <label for="isenha"></i></label>
                        </div>
                        <input type="submit" value="Entrar">
                        <a href="esqueci.html" class="botao">Esqueci a senha <i class="fa-solid fa-envelope"></i></a>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
